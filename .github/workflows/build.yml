name: Build Mod

on: [push]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v3

      - name: Build Geode Mod
        uses: geode-sdk/build-geode-mod@main
        id: build

      - name: Upload
        uses: actions/upload-artifact@v3
        with:
          name: mod
          path: ${{ steps.build.outputs.build-output }}
