name: Build Geode Mod PRO

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      # 🔹 Clonar repo
      - name: Checkout
        uses: actions/checkout@v4

      # 🔹 Debug info (IMPORTANTE)
      - name: Debug info
        run: |
          echo "Sistema:"
          uname -a
          echo "Archivos:"
          ls -la

      # 🔹 Instalar Geode CLI limpio
      - name: Install Geode CLI
        run: |
          curl -sSL https://github.com/geode-sdk/cli/releases/latest/download/geode-linux.zip -o geode.zip
          unzip geode.zip
          chmod +x geode
          sudo mv geode /usr/local/bin/

      # 🔹 Verificar instalación
      - name: Check Geode
        run: geode --version

      # 🔹 Instalar binarios Android
      - name: Setup Android
        run: geode sdk install-binaries -p android64

      # 🔹 Build del mod
      - name: Build mod
        run: |
          geode build -p android64 || (echo "❌ BUILD FALLÓ" && exit 1)

      # 🔹 Verificar archivo .geode
      - name: Check output
        run: |
          echo "Buscando archivo .geode..."
          find . -name "*.geode" || (echo "❌ NO SE GENERÓ EL MOD" && exit 1)

      # 🔹 Subir archivo (VERSIÓN NUEVA)
      - name: Upload mod
        uses: actions/upload-artifact@v4
        with:
          name: geode-mod
          path: |
            **/*.geode
          if-no-files-found: error
