name: Build Geode Mod FIXED

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      # 🔹 Clonar repo
      - uses: actions/checkout@v4

      # 🔹 Forzar Node 24 (evita errores futuros)
      - name: Fix Node version
        run: echo "FORCE_JAVASCRIPT_ACTIONS_TO_NODE24=true" >> $GITHUB_ENV

      # 🔹 Instalar dependencias básicas
      - name: Install dependencies
        run: sudo apt update && sudo apt install -y unzip curl git

      # 🔹 Instalar Geode CLI
      - name: Install Geode CLI
        run: |
          curl -sSL https://github.com/geode-sdk/cli/releases/latest/download/geode-linux.zip -o geode.zip
          unzip geode.zip
          chmod +x geode
          sudo mv geode /usr/local/bin/

      # 🔹 Verificar CLI
      - name: Check Geode
        run: geode --version

      # 🔴 🔥 INSTALAR SDK (LO QUE TE FALTABA)
      - name: Install SDK
        run: geode sdk install

      # 🔹 Instalar binarios Android
      - name: Install Android binaries
        run: geode sdk install-binaries -p android64

      # 🔹 Build con debug fuerte
      - name: Build mod
        run: |
          set -e
          echo "🔥 Iniciando build..."
          geode build -p android64

      # 🔹 Verificar salida
      - name: Check output
        run: |
          echo "🔍 Buscando .geode..."
          find . -name "*.geode"

      # 🔹 Subir mod
      - name: Upload mod
        uses: actions/upload-artifact@v4
        with:
          name: geode-mod
          path: "**/*.geode"
          if-no-files-found: error
