name: Build Geode Mod for Android

on:
  push:
    branches: ["main"]
  workflow_dispatch:
    inputs:
      platform:
        description: Android target
        required: true
        type: choice
        options:
          - android32
          - android64
        default: android64

concurrency:
  group: geode-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 75

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Resolve target
        id: meta
        shell: bash
        run: |
          set -Eeuo pipefail
          PLATFORM="${{ github.event.inputs.platform }}"
          if [ -z "${PLATFORM:-}" ]; then
            PLATFORM="android64"
          fi

          case "$PLATFORM" in
            android32) TARGET="Android32" ;;
            android64) TARGET="Android64" ;;
            *)
              echo "::error title=Invalid platform::Unsupported platform: $PLATFORM"
              exit 1
              ;;
          esac

          echo "platform=$PLATFORM" >> "$GITHUB_OUTPUT"
          echo "target=$TARGET" >> "$GITHUB_OUTPUT"

      - name: Build Geode Mod
        id: build
        uses: geode-sdk/build-geode-mod@main
        with:
          sdk: given
          cli: latest
          target: ${{ steps.meta.outputs.target }}
          path: .
          bindings: geode-sdk/bindings
          android-min-sdk: 23
          build-config: Release
          use-lto: true

      - name: Upload .geode artifact
        uses: actions/upload-artifact@v4
        with:
          name: geode-mod-${{ steps.meta.outputs.platform }}
          path: ${{ steps.build.outputs.build-output }}
          if-no-files-found: error
