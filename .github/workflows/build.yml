name: Build Geode Mod for Android64

on:
  push:
    branches: ["main"]
  workflow_dispatch:

concurrency:
  group: geode-android64-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 60

    env:
      CARGO_TERM_COLOR: always
      RUST_BACKTRACE: full
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
      GEODE_CLI_VERSION: v3.7.4
      ANDROID_NDK_VERSION: r29
      ANDROID_NDK_ROOT: ${{ github.workspace }}/android-ndk-r29
      CPM_SOURCE_CACHE: ${{ github.workspace }}/.cpm-cache

    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 1

      - name: Install system dependencies
        shell: bash
        run: |
          set -Eeuo pipefail
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential \
            ca-certificates \
            clang \
            cmake \
            curl \
            expect \
            git \
            libssl-dev \
            lld \
            ninja-build \
            pkg-config \
            python3 \
            unzip \
            zstd

      - name: Install Rust
        shell: bash
        run: |
          set -Eeuo pipefail
          curl --proto '=https' --tlsv1.2 -fsSL https://sh.rustup.rs | sh -s -- -y --profile minimal --default-toolchain stable
          echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"
          source "$HOME/.cargo/env"
          rustup toolchain install stable --profile minimal
          rustup default stable
          rustc --version
          cargo --version

      - name: Cache Cargo and CPM sources
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            ~/.cache/cargo
            ${{ github.workspace }}/.cpm-cache
          key: ${{ runner.os }}-geode-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-geode-

      - name: Install Geode CLI
        shell: bash
        run: |
          set -Eeuo pipefail
          source "$HOME/.cargo/env"

          retry() {
            local attempts="$1"
            shift
            local attempt=1
            until "$@"; do
              if (( attempt >= attempts )); then
                return 1
              fi
              attempt=$((attempt + 1))
              sleep $((attempt * 5))
            done
          }

          retry 3 cargo install --locked --force --git https://github.com/geode-sdk/cli --tag "${GEODE_CLI_VERSION}"
          geode --version

      - name: Setup Geode profile
        shell: bash
        run: |
          set -Eeuo pipefail
          source "$HOME/.cargo/env"

          retry() {
            local attempts="$1"
            shift
            local attempt=1
            until "$@"; do
              if (( attempt >= attempts )); then
                return 1
              fi
              attempt=$((attempt + 1))
              sleep $((attempt * 5))
            done
          }

          setup_with_pipe() {
            mkdir -p "$HOME/.config/geode"

            printf '%s\n%s\n%s\n%s\n' \
              "$HOME/GeometryDash" \
              "ci" \
              "y" \
              "y" | geode config setup
          }

          if ! retry 3 setup_with_pipe; then
            if command -v expect >/dev/null 2>&1; then
              expect -c "set timeout 180; spawn geode config setup; expect { -re {(?i)(path|directory|folder|location|install)} { send -- \"$HOME/GeometryDash\r\"; exp_continue } -re {(?i)(name|profile)} { send -- \"ci\r\"; exp_continue } -re {(?i)(y/n|yes/no|\\[y/N\\]|\\(y/N\\))} { send -- \"y\r\"; exp_continue } eof { exit 0 } timeout { exit 1 } }"
            else
              echo 'Geode profile setup failed'
              exit 1
            fi
          fi

          test -d "$HOME/.config/geode"

      - name: Install Geode SDK
        shell: bash
        run: |
          set -Eeuo pipefail
          source "$HOME/.cargo/env"

          retry() {
            local attempts="$1"
            shift
            local attempt=1
            until "$@"; do
              if (( attempt >= attempts )); then
                return 1
              fi
              attempt=$((attempt + 1))
              sleep $((attempt * 5))
            done
          }

          retry 3 geode sdk install

      - name: Install Android64 binaries
        shell: bash
        run: |
          set -Eeuo pipefail
          source "$HOME/.cargo/env"

          retry() {
            local attempts="$1"
            shift
            local attempt=1
            until "$@"; do
              if (( attempt >= attempts )); then
                return 1
              fi
              attempt=$((attempt + 1))
              sleep $((attempt * 5))
            done
          }

          retry 3 geode sdk install-binaries -p android64

      - name: Install Android NDK
        shell: bash
        run: |
          set -Eeuo pipefail
          NDK_URL="https://dl.google.com/android/repository/android-ndk-${ANDROID_NDK_VERSION}-linux.zip"
          WORKDIR="$GITHUB_WORKSPACE/.ndk-download"

          rm -rf "$WORKDIR"
          mkdir -p "$WORKDIR"

          curl -fsSL --retry 5 --retry-all-errors -o "$WORKDIR/ndk.zip" "$NDK_URL"
          unzip -q "$WORKDIR/ndk.zip" -d "$WORKDIR"

          test -d "$WORKDIR/android-ndk-${ANDROID_NDK_VERSION}/toolchains/llvm/prebuilt/linux-x86_64"

          rm -rf "$ANDROID_NDK_ROOT"
          mv "$WORKDIR/android-ndk-${ANDROID_NDK_VERSION}" "$ANDROID_NDK_ROOT"

      - name: Build mod
        shell: bash
        run: |
          set -Eeuo pipefail
          source "$HOME/.cargo/env"

          retry() {
            local attempts="$1"
            shift
            local attempt=1
            until "$@"; do
              if (( attempt >= attempts )); then
                return 1
              fi
              attempt=$((attempt + 1))
              sleep $((attempt * 5))
            done
          }

          retry 3 geode build -p android64

      - name: Verify .geode output
        shell: bash
        run: |
          set -Eeuo pipefail

          GEODE_FILE="$(find build-android64 -type f -name '*.geode' -print -quit 2>/dev/null || true)"
          if [ -z "$GEODE_FILE" ]; then
            GEODE_FILE="$(find . -type f -name '*.geode' -print -quit 2>/dev/null || true)"
          fi

          if [ -z "$GEODE_FILE" ]; then
            echo "No .geode file found"
            exit 1
          fi

          mkdir -p dist
          cp -f "$GEODE_FILE" dist/
          find dist -type f -name '*.geode' -print

      - name: Upload .geode artifact
        uses: actions/upload-artifact@v4
        with:
          name: geode-mod-android64
          path: dist/*.geode
          if-no-files-found: error
