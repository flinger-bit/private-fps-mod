name: Build Geode Mod for Android64

on:
  push:
    branches: ["main"]
  workflow_dispatch:

concurrency:
  group: geode-android64-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest

    env:
      CARGO_TERM_COLOR: always

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install system dependencies
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential \
            ca-certificates \
            cmake \
            curl \
            git \
            libssl-dev \
            ninja-build \
            pkg-config \
            unzip

      - name: Install Rust
        run: |
          set -euo pipefail
          if ! command -v cargo >/dev/null 2>&1; then
            curl --proto '=https' --tlsv1.2 -fsSL https://sh.rustup.rs | sh -s -- -y --profile minimal
          fi
          echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"
          source "$HOME/.cargo/env"
          rustc --version
          cargo --version

      - name: Install Geode CLI
        run: |
          set -euo pipefail
          source "$HOME/.cargo/env"
          cargo install --locked --git https://github.com/geode-sdk/cli
          geode --version

      - name: Setup Geode config (CI FIX)
        run: |
          set -euo pipefail
          source "$HOME/.cargo/env"
          geode config setup --default || true

      - name: Install Geode SDK
        run: |
          set -euo pipefail
          source "$HOME/.cargo/env"
          geode sdk install

      - name: Install Android64 binaries
        run: |
          set -euo pipefail
          source "$HOME/.cargo/env"
          geode sdk install-binaries -p android64

      - name: Build mod
        run: |
          set -euo pipefail
          source "$HOME/.cargo/env"
          geode build -p android64

      - name: Verify .geode output
        run: |
          set -euo pipefail
          FILES=$(find . -type f -name "*.geode")
          if [ -z "$FILES" ]; then
            echo "No .geode file found!"
            exit 1
          fi
          echo "$FILES"

      - name: Upload .geode artifact
        uses: actions/upload-artifact@v4
        with:
          name: geode-mod-android64
          path: |
            **/*.geode
          if-no-files-found: error
