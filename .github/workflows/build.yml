name: Build Geode Mod for Android64

on:
  push:
    branches: ["main"]
  workflow_dispatch:

concurrency:
  group: geode-android64-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 60

    env:
      CARGO_TERM_COLOR: always
      RUST_BACKTRACE: full
      GEODE_CLI_VERSION: v3.7.4
      ANDROID_NDK_VERSION: r29

    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 1

      - name: Install system dependencies
        shell: bash
        run: |
          set -Eeuo pipefail
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential \
            ca-certificates \
            clang \
            curl \
            git \
            libssl-dev \
            lld \
            ninja-build \
            pkg-config \
            python3 \
            python3-pip \
            unzip \
            zstd

      - name: Install modern CMake
        shell: bash
        run: |
          set -Eeuo pipefail
          python3 -m pip install --user --upgrade cmake
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
          cmake --version

      - name: Install Rust
        shell: bash
        run: |
          set -Eeuo pipefail
          curl --proto '=https' --tlsv1.2 -fsSL https://sh.rustup.rs | sh -s -- -y --profile minimal --default-toolchain stable
          echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"
          source "$HOME/.cargo/env"
          rustup toolchain install stable --profile minimal
          rustup default stable
          rustc --version
          cargo --version

      - name: Cache Cargo and CPM sources
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            ~/.cache/cargo
            ${{ github.workspace }}/.cpm-cache
          key: ${{ runner.os }}-geode-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-geode-

      - name: Install Geode CLI
        shell: bash
        run: |
          set -Eeuo pipefail
          source "$HOME/.cargo/env"

          retry() {
            local attempts="$1"
            shift
            local attempt=1
            until "$@"; do
              if (( attempt >= attempts )); then
                return 1
              fi
              attempt=$((attempt + 1))
              sleep $((attempt * 5))
            done
          }

          retry 3 cargo install --locked --force --git https://github.com/geode-sdk/cli --tag "${GEODE_CLI_VERSION}"
          geode --version

      - name: Write helper script
        shell: bash
        run: |
          set -Eeuo pipefail
          cat > "$RUNNER_TEMP/geode_helpers.sh" <<'EOF'
          set -Eeuo pipefail

          retry() {
            local attempts="$1"
            shift
            local attempt=1
            until "$@"; do
              if (( attempt >= attempts )); then
                return 1
              fi
              attempt=$((attempt + 1))
              sleep $((attempt * 5))
            done
          }

          setup_profile() {
            mkdir -p "$HOME/.config/geode"
            if geode config setup --default; then
              return 0
            fi
            printf '\n' | geode config setup
          }

          run_geode() {
            local label="$1"
            shift
            local attempt=1
            local log
            log="$(mktemp)"

            while true; do
              echo "Running: $label (attempt $attempt)"
              if "$@" 2>&1 | tee "$log"; then
                rm -f "$log"
                return 0
              fi

              if grep -qi "No Geode profiles found" "$log"; then
                setup_profile || true
              fi

              if (( attempt >= 3 )); then
                cat "$log"
                rm -f "$log"
                return 1
              fi

              attempt=$((attempt + 1))
              sleep $((attempt * 5))
            done
          }

          install_ndk() {
            local version="$1"
            local url="$2"
            local workdir="$RUNNER_TEMP/ndk-${version}"

            rm -rf "$workdir"
            mkdir -p "$workdir"

            curl -fsSL --retry 5 --retry-all-errors -o "$workdir/ndk.zip" "$url"
            unzip -q "$workdir/ndk.zip" -d "$workdir"

            local extracted="$workdir/android-ndk-${version}"
            test -d "$extracted/toolchains/llvm/prebuilt/linux-x86_64"

            rm -rf "$ANDROID_NDK_ROOT"
            mv "$extracted" "$ANDROID_NDK_ROOT"
          }
          EOF
          chmod +x "$RUNNER_TEMP/geode_helpers.sh"

      - name: Setup Geode profile
        shell: bash
        run: |
          set -Eeuo pipefail
          source "$HOME/.cargo/env"
          source "$RUNNER_TEMP/geode_helpers.sh"
          retry 3 setup_profile

      - name: Install Geode SDK
        shell: bash
        run: |
          set -Eeuo pipefail
          source "$HOME/.cargo/env"
          source "$RUNNER_TEMP/geode_helpers.sh"
          run_geode "Install Geode SDK" geode sdk install

      - name: Install Android64 binaries
        shell: bash
        run: |
          set -Eeuo pipefail
          source "$HOME/.cargo/env"
          source "$RUNNER_TEMP/geode_helpers.sh"
          run_geode "Install Android64 binaries" geode sdk install-binaries -p android64

      - name: Install Android NDK
        shell: bash
        env:
          ANDROID_NDK_ROOT: ${{ github.workspace }}/android-ndk-r29
        run: |
          set -Eeuo pipefail
          source "$RUNNER_TEMP/geode_helpers.sh"
          install_ndk "${ANDROID_NDK_VERSION}" "https://dl.google.com/android/repository/android-ndk-${ANDROID_NDK_VERSION}-linux.zip"
          test -d "$ANDROID_NDK_ROOT/toolchains/llvm/prebuilt/linux-x86_64"

      - name: Build mod
        shell: bash
        env:
          ANDROID_NDK_ROOT: ${{ github.workspace }}/android-ndk-r29
        run: |
          set -Eeuo pipefail
          source "$HOME/.cargo/env"
          source "$RUNNER_TEMP/geode_helpers.sh"
          run_geode "Build Geode mod" geode build -p android64

      - name: Verify .geode output
        shell: bash
        run: |
          set -Eeuo pipefail
          GEODE_FILE="$(find build-android64 -type f -name '*.geode' -print -quit 2>/dev/null || true)"
          if [ -z "$GEODE_FILE" ]; then
            GEODE_FILE="$(find . -type f -name '*.geode' -print -quit 2>/dev/null || true)"
          fi

          if [ -z "$GEODE_FILE" ]; then
            echo "No .geode file found"
            exit 1
          fi

          mkdir -p dist
          cp -f "$GEODE_FILE" dist/
          find dist -type f -name '*.geode' -print

      - name: Upload .geode artifact
        uses: actions/upload-artifact@v4
        with:
          name: geode-mod-android64
          path: dist/*.geode
          if-no-files-found: error
